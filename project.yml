name: ATTA
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  ATTA:
    type: application
    platform: iOS
    sources:
      - ATTA
      - Shared
      - Resources
    info:
      path: ATTA/Info.plist
      properties:
        CFBundleDisplayName: ATTA
        UILaunchScreen: {}
        UIAppFonts:
          - ibm_plex_sans_thai_light.ttf
          - ibm_plex_sans_thai_regular.ttf
          - ibm_plex_sans_thai_medium.ttf
          - ibm_plex_sans_thai_semibold.ttf
          - noto_serif_thai_light.ttf
          - noto_serif_thai_regular.ttf
          - noto_serif_thai_medium.ttf
          - noto_serif_thai_semibold.ttf
        UIBackgroundModes:
          - audio
        NSPhotoLibraryAddUsageDescription: "ATTA saves wallpapers you choose to your photo library."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atta.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: AttaWidget
        embed: true
  AttaWidget:
    type: app-extension
    platform: iOS
    sources:
      - AttaWidget
      - Shared
      - Resources/Fonts
    info:
      path: AttaWidget/Info.plist
      properties:
        CFBundleDisplayName: ATTA
        UIAppFonts:
          - ibm_plex_sans_thai_light.ttf
          - ibm_plex_sans_thai_regular.ttf
          - ibm_plex_sans_thai_medium.ttf
          - ibm_plex_sans_thai_semibold.ttf
          - noto_serif_thai_light.ttf
          - noto_serif_thai_regular.ttf
          - noto_serif_thai_medium.ttf
          - noto_serif_thai_semibold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atta.ios.widget
